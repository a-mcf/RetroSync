{{define "activate-modal"}}
<div class="modal-backdrop" id="modal-backdrop">
  <div class="modal" role="dialog" aria-modal="true" aria-label="Start playing {{.GameDisplay}}">
    <div class="modal-head">
      <h3>{{.GameDisplay}}{{if .SyncName}} — {{.SyncName}}{{end}} <span class="sub">{{.System}}</span></h3>
      <button class="modal-close" type="button"
              aria-label="Close"
              onclick="document.getElementById('modal').innerHTML='';">&times;</button>
    </div>
    <p class="sub">Which save do you want to start from?</p>
    <form hx-post="/api/syncs/{{.SyncID}}/activate"
          hx-target="#dashboard" hx-swap="outerHTML" hx-select="#dashboard"
          hx-on::after-request="if(event.detail.successful) document.getElementById('modal').innerHTML='';">
      <input type="hidden" name="csrf_token" value="{{.CSRF}}">
      <input type="hidden" name="primary_node" value="{{.PrimaryNode}}">
      <ul class="source-list">
        {{range .Sources}}
        <li>
          <label class="source-opt">
            <input type="radio" name="direction" value="{{.Direction}}" {{if .Selected}}checked{{end}}>
            <span class="source-id">{{.NodeID}}{{if .IsPrimary}} <span class="you">← you</span>{{end}}</span>
            <span class="source-mtime">{{.Mtime}}</span>
          </label>
        </li>
        {{end}}
      </ul>
      <div class="modal-actions">
        <button class="linkbtn" type="button"
                onclick="document.getElementById('modal').innerHTML='';">Cancel</button>
        <button class="btn" type="submit">Start playing</button>
      </div>
    </form>
  </div>
</div>
{{end}}
